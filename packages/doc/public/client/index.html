    <style>
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-size: 14px;
        overflow: hidden;
      }
      .elux-app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      .elux-window {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        overflow: hidden;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transform: none;
        transition: opacity 0.2s ease-out;
      }
      .elux-window:first-child {
        display: flex;
      }
      .elux-window:last-child {
        display: flex;
      }
      .elux-app > div:last-of-type {
        display: flex !important;
      }
      .elux-app > div:last-of-type ~ article {
        display: flex !important;
      }
      .elux-push .elux-window {
        transition: none;
      }
      .elux-animation .elux-window:nth-last-child(2) {
        display: flex;
      }
      .elux-change .elux-window:last-child {
        opacity: 0;
      }

      /* .elux-animation > div:nth-last-of-type(2) {
        display: flex !important;
      } */

      .elux-app > article > :first-child {
        overflow: hidden;
        background: #fff;
        border-radius: 4px;
        box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.2);
        padding: 5px 1px;
        position: relative;
        max-width: 100vw;
        max-height: 100vh;
        box-sizing: border-box;
      }
      .elux-app > article > .size-max {
        width: 100vw;
        height: 100vh;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #root-loading {
        display: block;
        position: fixed;
        z-index: 999;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }
      @keyframes root-loading-ball {
        0% {
          transform: translate(-50%, -50%) scale(0.5);
        }

        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes root-loading-text {
        0% {
          opacity: 0.1;
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0.1;
        }
      }
      #root-loading::before {
        position: absolute;
        left: 50%;
        top: 50%;
        content: '.';
        font-size: 0;
        width: 64px;
        height: 64px;
        background: #ddd;
        border-radius: 64px;
        transform: translate(-50%, -50%) scale(0.5);
        -ms-transform: translate(-50%, -50%) scale(0.5);
        animation: root-loading-ball 1s infinite;
      }
      #root-loading::after {
        font-size: 12px;
        font-family: sans-serif;
        color: #888;
        position: absolute;
        content: 'Loading';
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        animation: root-loading-text 1s infinite;
      }
    </style>
